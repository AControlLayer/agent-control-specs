name: Spec Contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: spec-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-contracts:
    name: spec-contracts-required
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check package contracts and projections
        run: npm run check

      - name: Install public site dependencies
        run: npm ci --prefix site

      - name: Audit production dependencies
        run: npm audit --prefix site --omit=dev --audit-level=high

      - name: Validate schemas, examples, and vectors
        run: npm test --prefix site

      - name: Build public site from canonical sources
        run: npm run build --prefix site

      - name: Validate publishable package contents
        run: npm pack --dry-run --json
